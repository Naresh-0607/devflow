[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Add the backend directory to sys.path so `app` can be imported by env.py.
prepend_sys_path = .

# Alembic overrides this at runtime from DATABASE_URL (see migrations/env.py).
sqlalchemy.url = sqlite+aiosqlite:///./devflow.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
