<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#07080c" />
		<meta name="description" content="DevFlow — your AI-powered developer memory. It remembers what you were building." />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="DevFlow" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply the saved/system theme before first paint to avoid a flash.
			(function () {
				try {
					var mode = localStorage.getItem('dvf_theme') || 'system';
					var dark =
						mode === 'dark' ||
						(mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('light', !dark);
					document.documentElement.dataset.theme = mode;
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (error) {
					/* default dark palette */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
